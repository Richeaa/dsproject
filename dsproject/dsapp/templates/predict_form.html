{% extends "about.html" %}
{% load static %}

{% block content %}
<main>
<link rel="stylesheet" href="{% static 'style.css' %}">
<div class="prediction-container">
  <div class="prediction-header">
    <strong><h2>Student Cluster Prediction</h2></strong>
    <strong><p>Enter data to predict their learning behavior cluster</p></strong>

    <div class="form-actions" style="justify-content: center;">
  <a href="{% url 'search_cluster' %}" class="btn btn-primary">Existing Student</a>
</div>
  </div>
    <form method="POST" action="{% url 'predict_cluster' %}" class="prediction-form">
      {% csrf_token %}

      <div class="form-row">
        <div class="form-group">
          <label>Total Study Time (hours)</label>
          <input type="number" step="any" name="total_study_time" required>
        </div>

        <div class="form-group">
          <label>Average Study Time (hours)</label>
          <input type="number" step="any" name="avg_study_time" required>
        </div>

        <div class="form-group">
          <label>Activity Count</label>
          <input type="number" name="activity_count" required>
        </div>

        <div class="form-group">
          <label>Active Days</label>
          <input type="number" name="active_days" required>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Predict Cluster</button>
        <button type="reset" class="btn btn-secondary">Clear Form</button>
      </div>
    </form>

    <div class="alternative-action">
      <p>Looking for an existing student? <a class="search-link" href="{% url 'search_cluster' %}">Search Student Cluster</a></p>
    </div>
  </div>
</div>
</main>
{% endblock %}
